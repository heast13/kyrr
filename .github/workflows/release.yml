name: release

# Builds the Windows installer on every push to main (as an artifact) and
# for tags v* as a draft release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      # Only to create the draft release for a tag.
      contents: write
    env:
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\assets\sherpa-onnx\lib
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Fetch assets
        run: python scripts/fetch-assets.py --windows
      - name: Build
        run: cargo build --release --locked -p kyrr -p kyrr-apo
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: kyrr-installer
          path: |
            dist/kyrr-setup-*.exe
            dist/kyrr-setup-*.exe.sha256
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG --draft --title "kyrr $env:TAG" --notes-file CHANGELOG.md (Get-ChildItem dist\kyrr-setup-*).FullName
