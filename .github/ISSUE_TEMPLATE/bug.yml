name: Something does not work
description: kyrr misbehaves, crashes or does nothing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your system
      description: >
        Windows: the version (Windows 11 25H2, say). Linux: the distribution,
        the desktop (GNOME, KDE, Hyprland, ...) and whether it runs X11 or Wayland.
      placeholder: Windows 11 25H2, or Fedora 43, GNOME 49, Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kyrr version
      description: At the bottom of the Settings page.
      placeholder: "0.5.8"
  - type: input
    id: microphone
    attributes:
      label: Microphone (and whether another audio tool, like Equalizer APO on Windows, is installed)
  - type: textarea
    id: details
    attributes:
      label: Details from kyrr
      description: >
        The status line in kyrr's main window. On Windows, if the filter is
        involved, the log
        C:\Windows\ServiceProfiles\LocalService\AppData\Local\Temp\kyrr-apo.log
        (needs admin rights to open) helps a lot. On Linux, the lines kyrr prints
        when you start it from a terminal. Both contain events only, no audio.
