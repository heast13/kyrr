[package]
name = "kyrr-apo"
description = "kyrr's voice filter as a Windows audio processing object"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kyrr_apo"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = ["kyrr-denoise/native"]

[target.'cfg(windows)'.dependencies]
kyrr-common = { path = "../kyrr-common" }
kyrr-denoise = { path = "../kyrr-denoise", default-features = false }
kyrr-voice = { path = "../kyrr-voice" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The `implement` macro expands to paths in windows-core.
windows-core = "0.62"

[build-dependencies]
# Version info in kyrr_apo.dll (needs the Windows resource compiler).
winresource = "0.1"
