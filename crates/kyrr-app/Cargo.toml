[package]
name = "kyrr"
description = "Clean microphone and F9 dictation, local and free"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kyrr-common = { path = "../kyrr-common" }
kyrr-dictate = { path = "../kyrr-dictate" }
# The user's own servers: reworking the text, recognising speech.
kyrr-server = { path = "../kyrr-server" }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for "Check for updates" (the same TLS setup as the model download).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Checking a downloaded update against its release's SHA256 file.
sha2 = "0.11"
# Voice memos: Opus in Ogg files. libopus is built from the source the crate
# bundles (CMake, linked statically), so no system library is needed.
opus = "0.4"
ogg = "0.9"
# The local date and time in a memo's name.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Microphones that do not run at a rate Opus takes (44.1 kHz) are converted.
rubato.workspace = true
audioadapter-buffers.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The window is drawn by the software renderer only: no OpenGL context (about
# 100 MB less memory, no GPU driver in the way, nothing to fail on a machine
# without libEGL or libwayland-egl). unstable-winit-030 gives the screen's
# size, for the window's height.
slint = { version = "1.18", default-features = false, features = ["std", "backend-default", "accessibility", "compat-1-2", "system-tray", "renderer-software", "software-renderer-systemfonts", "raw-window-handle-06", "unstable-winit-030"] }
# On Linux the filter runs inside the app, on a virtual microphone.
kyrr-linux = { path = "../kyrr-linux" }
kyrr-denoise = { path = "../kyrr-denoise" }
kyrr-voice = { path = "../kyrr-voice" }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.18", features = ["system-tray", "renderer-software", "software-renderer-systemfonts", "raw-window-handle-06", "unstable-winit-030"] }
kyrr-windows = { path = "../kyrr-windows" }
# The window's HWND, to bring it to the front. The Documents folder for voice
# memos (Shell), wherever Windows keeps it.
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "1.18"
# Icon and version info in kyrr.exe (needs the Windows resource compiler).
winresource = "0.1"
