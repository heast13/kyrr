[workspace]
resolver = "2"
members = [
    "crates/kyrr-apo",
    "crates/kyrr-app",
    "crates/kyrr-common",
    "crates/kyrr-denoise",
    "crates/kyrr-dictate",
    "crates/kyrr-linux",
    "crates/kyrr-voice",
    "crates/kyrr-windows",
]
exclude = ["vendor"]

[workspace.package]
version = "0.6.0"
authors = ["heast13"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heast13/kyrr"

[workspace.dependencies]
# DPDFNet engine from HushMic v0.10.2, vendored with the MSVC patches from
# dpdf-voice. See vendor/hushmic-denoiser/PATCHES.md. The native C engine is
# switched on through kyrr-denoise's `native` feature.
hushmic-denoiser = { path = "vendor/hushmic-denoiser" }
rubato = "5"
audioadapter-buffers = "5.1"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
