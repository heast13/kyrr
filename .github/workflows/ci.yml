name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # sherpa-onnx without text-to-speech, fetched by fetch-assets.py.
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\assets\sherpa-onnx\lib
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-onnx-sys unpacks its prebuilt libraries here; the cache
          # would otherwise keep its build output but drop the libraries.
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Fetch assets
        run: python scripts/fetch-assets.py --windows --test
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --workspace
      - name: Check binaries
        run: |
          cargo build --release --locked -p kyrr -p kyrr-apo
          python scripts/check-binaries.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-onnx-sys unpacks its prebuilt libraries here; the cache
          # would otherwise keep its build output but drop the libraries.
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Fetch assets
        run: python3 scripts/fetch-assets.py --test
      - name: Test
        run: cargo test --release --workspace
