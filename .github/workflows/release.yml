name: release

# Builds the Windows installer and the Linux AppImage and tarball on every
# push to main (as artifacts) and for tags v* as one draft release, which the
# last job creates once all are built. The Flatpak is not part of a release
# until it is on Flathub; flatpak.yml builds it on its own.
#
# Tags are code signed through SignPath (free for open source, certificate by
# SignPath Foundation) once the repository variable SIGNPATH_ORGANIZATION_ID
# is set: first kyrr.exe and kyrr_apo.dll, then the installer built from
# them. Every signing request waits for a manual approval on SignPath.
# Settings: secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG; the artifact
# configurations are in installer/signpath/.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
      # SignPath reads the workflow run and downloads the artifacts.
      actions: read
    env:
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\assets\sherpa-onnx\lib
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Fetch assets
        run: python scripts/fetch-assets.py --windows
      - name: Build
        run: cargo build --release --locked -p kyrr -p kyrr-apo
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Stage
        run: python scripts/package.py --stage-only

      - name: Upload binaries for signing
        id: unsigned-binaries
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kyrr-unsigned-binaries
          path: |
            dist/stage/kyrr.exe
            dist/stage/kyrr_apo.dll
      - name: Sign binaries
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-binaries
      - name: Use the signed binaries
        if: env.SIGN == 'true'
        run: Copy-Item dist\signed-binaries\kyrr.exe, dist\signed-binaries\kyrr_apo.dll dist\stage -Force

      - name: Build the installer
        run: python scripts/package.py --installer-only

      - name: Upload installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kyrr-unsigned-installer
          path: dist/kyrr-setup-*.exe
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-installer
      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: Copy-Item dist\signed-installer\kyrr-setup-*.exe dist -Force

      - name: Checksum
        run: python scripts/package.py --checksum-only
      - uses: actions/upload-artifact@v7
        with:
          name: kyrr-installer
          path: |
            dist/kyrr-setup-*.exe
            dist/kyrr-setup-*.exe.sha256

  linux:
    # The AppImage runs on the glibc of this runner (2.39) or newer: Ubuntu
    # 24.04, Fedora 40, Debian 13, Arch. Move to an older runner image to
    # reach older distributions.
    runs-on: ubuntu-24.04
    env:
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/assets/sherpa-onnx/lib
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          # libxkbcommon-x11-0 is bundled into the AppImage (loaded at runtime).
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Fetch assets
        run: python3 scripts/fetch-assets.py --linux
      - name: Build
        run: cargo build --release --locked -p kyrr
      - name: Package
        run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@v7
        with:
          name: kyrr-linux
          path: |
            dist/kyrr-*.AppImage
            dist/kyrr-*.AppImage.sha256
            dist/kyrr-*.tar.gz
            dist/kyrr-*.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, linux]
    runs-on: ubuntu-24.04
    permissions:
      # Only to create the draft release.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      # By name: the signing steps upload unsigned copies as artifacts too.
      - uses: actions/download-artifact@v8
        with:
          name: kyrr-installer
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: kyrr-linux
          path: dist
      - name: Draft release
        run: |
          version=${TAG#v}
          signed=; [ "$SIGNED" = true ] && signed=--signed
          python3 scripts/release-notes.py "$version" $signed --out dist/notes.md
          # Also without the version, so releases/latest/download/kyrr-setup.exe
          # and .../kyrr-x86_64.AppImage always fetch the newest one.
          cp "dist/kyrr-setup-$version.exe" dist/kyrr-setup.exe
          cp "dist/kyrr-$version-x86_64.AppImage" dist/kyrr-x86_64.AppImage
          gh release create "$TAG" --draft --title "kyrr $TAG" --notes-file dist/notes.md \
            "dist/kyrr-setup-$version.exe" "dist/kyrr-setup-$version.exe.sha256" dist/kyrr-setup.exe \
            "dist/kyrr-$version-x86_64.AppImage" "dist/kyrr-$version-x86_64.AppImage.sha256" \
            dist/kyrr-x86_64.AppImage \
            "dist/kyrr-$version-linux-x86_64.tar.gz" "dist/kyrr-$version-linux-x86_64.tar.gz.sha256"
