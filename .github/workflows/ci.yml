name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # sherpa-onnx without text-to-speech, fetched by fetch-assets.py.
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\assets\sherpa-onnx\lib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # sherpa-onnx-sys unpacks its prebuilt libraries here; the cache
          # would otherwise keep its build output but drop the libraries.
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Fetch assets
        run: python scripts/fetch-assets.py --windows --test
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --workspace
      - name: Check binaries
        run: |
          cargo build --release --locked -p kyrr -p kyrr-apo
          python scripts/check-binaries.py

  linux:
    runs-on: ubuntu-24.04
    env:
      # sherpa-onnx without text-to-speech, fetched by fetch-assets.py.
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/assets/sherpa-onnx/lib
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev libfontconfig1-dev \
            libxkbcommon-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # sherpa-onnx-sys unpacks its prebuilt libraries here; the cache
          # would otherwise keep its build output but drop the libraries.
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Omarchy contract
        # Every control of the window has its way in the Omarchy bar menu
        # (packaging/omarchy/contract.json, docs/release-gate.md).
        run: python3 scripts/check-omarchy-contract.py
      - name: Fetch assets
        run: python3 scripts/fetch-assets.py --linux --test
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --workspace
      - name: Check binaries
        run: |
          cargo build --release --locked -p kyrr
          python3 scripts/check-binaries.py --linux
