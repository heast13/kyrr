# Publishes site/ (the landing page) to GitHub Pages.
# This does nothing useful until Pages is enabled once by hand:
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      # Browsers keep style.css and app.js for a while; a new version in the
      # link makes a visitor get the files that belong to the page.
      - name: Version the CSS and JS links
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/" site/index.html site/de/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
