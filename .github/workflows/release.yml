name: release

# Builds the Windows installer on every push to main (as an artifact) and
# for tags v* as a draft release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch assets
        run: python scripts/fetch-assets.py --windows
      - name: Build
        run: cargo build --release --locked -p kyrr -p kyrr-apo
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: kyrr-installer
          path: |
            dist/kyrr-setup-*.exe
            dist/kyrr-setup-*.exe.sha256
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --draft --title "kyrr ${{ github.ref_name }}" --notes "Draft" (Get-ChildItem dist\kyrr-setup-*).FullName
