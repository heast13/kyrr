[package]
name = "kyrr-denoise"
description = "DPDFNet voice filter for any capture format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The DPDFNet authors' C engine (INT8, AVX2), about half the CPU of ONNX
# Runtime. Needs a C compiler; without it only ONNX Runtime is available.
default = ["native"]
native = ["hushmic-denoiser/native"]

[dependencies]
hushmic-denoiser.workspace = true
rubato.workspace = true
audioadapter-buffers.workspace = true

[dev-dependencies]
