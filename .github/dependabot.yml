version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # windows-core has to match the version the windows crate uses;
      # it is bumped by hand together with windows.
      - dependency-name: windows-core
